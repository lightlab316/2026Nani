            ;

        /* 圓形半透明按鈕 */
        .pdf-fab {

            height: 72px;
            border-radius: 999px;

            background: rgba(0, 0, 0, .18);

        .pdf-fab:hover {

            box-shadow: 0 14px 26px rgba(0, 0, 0, .22);

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

        // 讓「鍵盤左右鍵」作用在最後一次點過/滑過的那個 viewer
        let activeViewer = null;

class PdfViewer {
  constructor(opts) {
    // required
    this.url = opts.url;
    this.reader = document.getElementById(opts.readerId);
    this.canvas = document.getElementById(opts.canvasId);
    this.ctx = this.canvas.getContext("2d");
    this.pageInfo = document.getElementById(opts.pageInfoId);
    this.prevBtn = document.getElementById(opts.prevBtnId);
    this.nextBtn = document.getElementById(opts.nextBtnId);

    // ✅ 新增：預設起始頁（預設 1）
    this.startPage = Math.max(1, parseInt(opts.startPage || 1, 10));

    this.pdfDoc = null;
    this.pageNum = 1;
    this.rendering = false;
    this.pending = null;

    // swipe
    this.sx = 0;
    this.sy = 0;
    this.st = 0;
    this.SWIPE_MIN_X = 60;
    this.SWIPE_MAX_Y = 70;
    this.SWIPE_MAX_TIME = 700;

    // cache
    this.pageCache = new Map(); // pageNum -> page

    this.bindEvents();
    this.load();
  }

  bindEvents() {
    // 按鈕
    this.prevBtn?.addEventListener("click", () => this.prevPage());
    this.nextBtn?.addEventListener("click", () => this.nextPage());

    // 讓鍵盤左右鍵控制最近操作的 viewer
    const activate = () => {
      activeViewer = this;
    };
    this.reader?.addEventListener("pointerdown", activate);
    this.reader?.addEventListener("touchstart", activate, { passive: true });

    // swipe
    if (this.reader) {
      this.reader.style.touchAction = "pan-y";

      this.reader.addEventListener(
        "touchstart",
        (e) => {
          if (e.touches.length !== 1) return;
          this.sx = e.touches[0].clientX;
          this.sy = e.touches[0].clientY;
          this.st = Date.now();
        },
        { passive: true }
      );

      this.reader.addEventListener(
        "touchend",
        (e) => {
          if (!this.pdfDoc) return;
          const t = e.changedTouches && e.changedTouches[0];
          if (!t) return;

          const dx = t.clientX - this.sx;
          const dy = t.clientY - this.sy;
          const dt = Date.now() - this.st;

          if (Math.abs(dy) > this.SWIPE_MAX_Y) return;
          if (dt > this.SWIPE_MAX_TIME) return;

          if (dx <= -this.SWIPE_MIN_X) this.nextPage();
          else if (dx >= this.SWIPE_MIN_X) this.prevPage();
        },
        { passive: true }
      );
    }

    // resize
    window.addEventListener("resize", () => {
      if (this.pdfDoc) this.queueRender(this.pageNum);
    });
  }

  computeScale(page) {
    const maxW = this.reader?.clientWidth || window.innerWidth;
    const v1 = page.getViewport({ scale: 1 });
    return Math.max(0.6, Math.min(maxW / v1.width, 3));
  }

  async load() {
    this.pageInfo.textContent = "載入中…";
    try {
      this.pdfDoc = await pdfjsLib.getDocument(this.url).promise;

      // ✅ 這裡就是「預設第幾頁」的關鍵
      const initial = Math.min(this.startPage, this.pdfDoc.numPages);
      this.pageNum = initial;

      this.pageCache.clear();
      this.pageInfo.textContent = `${this.pageNum} / ${this.pdfDoc.numPages}`;
      this.renderPage(this.pageNum);
    } catch (err) {
      console.error(err);
      this.pageInfo.textContent = "PDF 載入失敗";
    }
  }

  async getPage(num) {
    if (this.pageCache.has(num)) return this.pageCache.get(num);
    const page = await this.pdfDoc.getPage(num);
    this.pageCache.set(num, page);
    return page;
  }

  async renderPage(num) {
    this.rendering = true;

    // 🔒 render 中鎖定按鈕 + 顯示 loading
    if (this.prevBtn) this.prevBtn.disabled = true;
    if (this.nextBtn) this.nextBtn.disabled = true;
    this.pageInfo.textContent = `載入中… (${this.pageNum} / ${this.pdfDoc.numPages})`;

    try {
      const page = await this.getPage(num);
      const scale = this.computeScale(page);
      const viewport = page.getViewport({ scale });

      this.canvas.width = Math.floor(viewport.width);
      this.canvas.height = Math.floor(viewport.height);

      await page.render({ canvasContext: this.ctx, viewport }).promise;

      this.rendering = false;
      this.pageInfo.textContent = `${this.pageNum} / ${this.pdfDoc.numPages}`;

      if (this.prevBtn) this.prevBtn.disabled = this.pageNum <= 1;
      if (this.nextBtn) this.nextBtn.disabled = this.pageNum >= this.pdfDoc.numPages;

      // ⚡ 預先快取下一頁
      const next = this.pageNum + 1;
      if (next <= this.pdfDoc.numPages && !this.pageCache.has(next)) {
        this.pdfDoc
          .getPage(next)
          .then((p) => this.pageCache.set(next, p))
          .catch(() => {});
      }

      if (this.pending !== null) {
        const p = this.pending;
        this.pending = null;
        this.queueRender(p);
      }
    } catch (err) {
      this.rendering = false;
      console.error(err);
      this.pageInfo.textContent = "PDF 渲染失敗";
    }
  }

  queueRender(num) {
    if (this.rendering) this.pending = num;
    else this.renderPage(num);
  }

  prevPage() {
    if (!this.pdfDoc || this.pageNum <= 1) return;
    this.pageNum--;
    this.queueRender(this.pageNum);
  }

  nextPage() {
    if (!this.pdfDoc || this.pageNum >= this.pdfDoc.numPages) return;
    this.pageNum++;
    this.queueRender(this.pageNum);
  }
}

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('drawerOverlay');
        const closeBtn = document.getElementById('closeDrawerBtn');

        function openDrawer() {
            drawer.classList.remove('translate-x-full');
            overlay.classList.remove('pointer-events-none');
            overlay.classList.add('opacity-100');
            document.body.style.overflow = 'hidden'; // 防止背景滾動
        }

        function closeDrawer() {
            drawer.classList.add('translate-x-full');
            overlay.classList.remove('opacity-100');
            overlay.classList.add('pointer-events-none');
            document.body.style.overflow = '';
        }

        menuBtn?.addEventListener('click', openDrawer);
        closeBtn?.addEventListener('click', closeDrawer);
        overlay?.addEventListener('click', closeDrawer);

        // ESC 關閉
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeDrawer();
        });

        // 點抽屜內任何按鈕就關閉（你若要切換內容，也可以在這裡接你的 tab 邏輯）
        drawer?.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (btn && btn.classList.contains('drawer-pill')) closeDrawer();
        });
    </script>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>南一教材博覽會 - AI 亮點</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet" />

  <style>
    :root{
      --primary:#37A061;
      --secondary:#E27050;
      --border-light:#B7DDC5;
      --header-h:92px;
    }

    @font-face{
      font-family:'CP Font';
      src:url('./fonts/CP\ Font.woff') format('woff'),
          url('./fonts/CP\ Font.woff2') format('woff2');
      font-weight:normal;
      font-style:normal;
      font-display:swap;
    }

    body{
      font-family:'Noto Sans TC', sans-serif;
      background-color:#FFFDDE;
      color:#374151;
      margin:0;
      overflow-x:hidden;
      scroll-behavior:smooth;
    }

    p{ font-size:32px; font-weight:400; }
    .pr{ color:var(--primary); }
    .sd{ color:var(--secondary); }
    .heading1{ font-size:90px; }
    .title-cp{ font-family:'CP Font'; font-weight:300; }

    @media (max-width:1440px){
      .heading1{ font-size:70px; }
      p{ font-size:24px; }
    }
    @media (max-width:560px){
      .heading1{ font-size:48px; }
    }

    /* ===== Page transition ===== */
    .page-transition{ opacity:0; transition: opacity .35s ease; }
    .page-transition.is-visible{ opacity:1; }
    .page-transition.is-leaving{ opacity:0; }

    /* =========================
       BG Layers（AI 頁：首頁背景）
       ========================= */
    .bg-layers{
      position:fixed;
      inset:0;
      z-index:-20;
      pointer-events:none;
    }
    .bg-layer{
      position:absolute;
      inset:0;
      background-repeat:no-repeat;
      background-size:55% auto;
      opacity:0;
      transform: translateY(-6px);
      transition: opacity .25s ease, transform .25s ease;
    }
    .bg-layer.is-show{
      opacity:1;
      transform: translateY(0);
    }



.page_1 {
  background-image:
  url(./assets/page/nani_subject_earth.png), /* ✅ 第三張：先用同一張示範，你要換圖就換這裡 */
    url(./assets/page/nani_ai_bg_2.png);

  background-repeat: no-repeat, no-repeat;

  background-position:
    right 120px top 180px,  /* ③ 右上：對齊數學 */
    right 80px top 150px;  /* ③ 右上：對齊數學 */

  background-size:
  200px auto,
    40vw auto;
}

/* 第一張：用 pseudo-element 當「可被 JS 精準定位」的背景層 */
.page_1::before{
  content: "";
  position: absolute;
  left: 0;
  top: var(--ai-bg1-top, 0px);         /* ✅ JS 會寫入 */
  width: 100vw;
  height: var(--ai-bg1-h, 300px);      /* ✅ JS 會寫入 */
  background-image: url(./assets/page/nani_ai_bg_1.png);
  background-repeat: no-repeat;
  background-position: left top;
  background-size: 100% 100%;          /* 因為我們用「算好的高度」來裝 */
  pointer-events: none;
  z-index: -1;                         /* 確保在內容後面 */
}
    @media (max-width:768px){
      .bg-layer{ background-size:80% auto; }
    }

    /* Images/Icons */
    .titleImg{ width:450px; display:inline; }
    @media (max-width:1024px){ .titleImg{ width:300px; } }

    .shadowDef{ box-shadow:0 0 4px 0 #00000050; }
    .cardBox{ box-shadow:0 0 4px 0 #00000050; }

    /* ===== Header pills (desktop) ===== */
    .nav-pill{
      padding:8px 14px;
      border-radius:999px;
      font-weight:700;
      font-size:18px;
      line-height:1;
      color:rgba(0,0,0,.75);
      background:transparent;
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
    .nav-pill:hover{ transform: translateY(-2px); }
    .nav-pill--active{
        background:#E6744A;
        color:#fff;
        border: solid 2px #D76740;
    }
    .nav-pill--special{
        background: rgba(234,255,242,.92);
        color:#1f7a55;
        border: solid 2px #D5E3D4;
    }
    .nav-pill--special:hover{ background:#e07542; }

    /* ===== Drawer pills (mobile) ===== */
    .drawer-pill{
      width:100%;
      padding:14px 18px;
      border-radius:999px;
      font-weight:800;
      font-size:20px;
      line-height:1;
      background: rgba(255,255,255,.14);
      color: rgba(0,0,0,.78);
      transition: transform .18s ease, background .18s ease;
    }
    .drawer-pill:hover{
      transform: translateY(-2px);
      background: rgba(255,255,255,.22);
    }
    .drawer-pill--active{
      background: rgba(234,255,242,.92);
      color:#1f7a55;
    }
    .drawer-pill--special{
      background:#f08552;
      color:#fff;
    }
    .drawer-pill--special:hover{ background:#e07542; }

    /* fade-in (blocks) */
    .fade-in{ animation: fadeIn .5s ease-in; }
    @keyframes fadeIn{
      from{ opacity:0; transform: translateY(10px); }
      to{ opacity:1; transform: translateY(0); }
    }

    /* back-to-top */
    .leaf-animate{ animation: bounce 3s infinite ease-in-out; }
    @keyframes bounce{ 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-20px);} }

    /* anchor offset */
    .anchor-offset{ scroll-margin-top: calc(var(--header-h) + 18px); }

    /* Header reveal (hover/scroll) */
    .site-header{
      position:fixed;
      top:0; left:0; right:0;
      z-index:80;
      transform: translateY(-110%);
      opacity:0;
      pointer-events:none;
      transition: transform .18s ease, opacity .18s ease;
    }
    .site-header.is-show{
      transform: translateY(0);
      opacity:1;
      pointer-events:auto;
    }
    .site-header nav{ box-shadow: 0 14px 30px rgba(0,0,0,.14); }
    .top-reveal-zone{
      position:fixed;
      top:0; left:0; right:0;
      height:18px;
      z-index:90;
      background:transparent;
    }

    /* =========================
       ✅ AI 亮點：用原本風格做 UI
       ========================= */
    .ai-chip{
      border-radius:999px;
      font-weight:900;
      padding:10px 16px;
      box-shadow: 0 10px 22px rgba(0,0,0,.10);
      border:2px solid rgba(255,255,255,.8);
      background: rgba(255,255,255,.8);
      backdrop-filter: blur(8px);
      color:#1f7a55;
      transition: transform .15s ease, background .15s ease;
    }
    .ai-chip:hover{ transform: translateY(-2px); }
    .ai-chip.is-active{
      background:#E6744A;
      color:#fff;
      border-color:#D76740;
    }

    .ai-card{
      border-radius:20px;
      background: rgba(255,255,255,.85);
      border:3px solid rgba(255,255,255,.9);
      box-shadow: 0 18px 40px rgba(0,0,0,.12);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      cursor:pointer;
      overflow:hidden;
    }
    .ai-card:hover{
      transform: translateY(-6px);
      box-shadow: 0 24px 50px rgba(0,0,0,.16);
    }
    .ai-card.is-active{ border-color:#f5d05a; }

    .ai-media{
      border-radius:32px;
      overflow:hidden;
      border:10px solid rgba(240,249,244,.95);
      box-shadow: 0 18px 40px rgba(0,0,0,.14);
    }

    .ai-dot{
      width:12px; height:12px;
      border-radius:999px;
      background:#E6744A;
      box-shadow: 0 6px 12px rgba(0,0,0,.10);
      margin-top:10px;
      flex: 0 0 auto;
    }
  </style>
</head>

<body class="min-h-screen pb-12 relative page-transition page_1">
  <!-- Background Layers -->
  <div class="bg-layers" aria-hidden="true">
    <div id="bgHome" class="bg-layer bg-layer--home"></div>
  </div>

  <!-- ✅ 滑鼠靠近最上方觸發區 -->
  <div id="topRevealZone" class="top-reveal-zone" aria-hidden="true"></div>

  <!-- ✅ Header（預設隱藏，滾動/靠近頂端才出現） -->
  <header id="siteHeader" class="site-header">
    <div class="max-w-7xl mx-auto px-4 pt-6">
      <nav class="bg-[#F2C94C] rounded-full shadowDef px-6 md:px-12 py-3 flex items-center justify-between shadow-lg relative">
        <div class="text-white tracking-wider title-cp text-3xl md:text-4xl leading-none px-2">
          南一教材博覽會
        </div>

        <div class="hidden lg:flex items-center gap-2">
          <a href="/ai-template.html" class="nav-pill nav-pill--active">AI亮點</a>
          <a href="/e-subject.html" class="nav-pill">低年級</a>
          <a href="/e-subject-mid.html" class="nav-pill">中年級</a>
          <a href="/e-subject-high.html" class="nav-pill">高年級</a>
          <a href="/e-science.html" class="nav-pill">自然</a>
          <a href="/e-society.html" class="nav-pill">社會</a>
          <a href="/e-health.html" class="nav-pill">健體/綜合</a>
          <a href="/subject.html" class="nav-pill nav-pill--special">教材</a>
        </div>

        <button id="menuBtn" class="lg:hidden p-2 rounded-full bg-white/15 hover:bg-white/25 transition"
          aria-label="開啟選單" type="button">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" class="text-white">
            <path d="M4 7H20M4 12H20M4 17H20" stroke="white" stroke-width="2.5" stroke-linecap="round" />
          </svg>
        </button>

      </nav>
    </div>
  </header>

  <div class="max-w-6xl mx-auto px-4 pt-6">
    <!-- Drawer overlay + drawer -->
    <div id="drawerOverlay"
      class="fixed inset-0 bg-black/40 opacity-0 pointer-events-none transition-opacity duration-200 z-40"></div>

    <aside id="drawer"
      class="fixed top-0 right-0 h-full w-[70vw] max-w-[420px] bg-[#46a17b] shadow-2xl translate-x-full transition-transform duration-300 z-50">
      <div class="p-5 flex items-center justify-between border-b border-black/20">
        <div class="title-cp text-white text-3xl leading-none">選單</div>
        <button id="closeDrawerBtn" class="p-2 rounded-full bg-white/15 hover:bg-white/25 transition"
          aria-label="關閉選單" type="button">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
            <path d="M6 6L18 18M18 6L6 18" stroke="white" stroke-width="2.5" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <div class="p-5 flex flex-col gap-3">
        <a href="/subject.html" class="drawer-pill text-center">低年級</a>
        <a href="/subject-mid.html" class="drawer-pill text-center">中年級</a>
        <a href="/subject-high.html" class="drawer-pill text-center">高年級</a>
        <a href="/science.html" class="drawer-pill text-center">自然</a>
        <a href="/society.html" class="drawer-pill text-center">社會</a>
        <a href="/health.html" class="drawer-pill text-center">健體/綜合</a>
        <a href="/others.html" class="drawer-pill drawer-pill--special text-center">教材</a>
      </div>
    </aside>

    <main class="mt-20 space-y-16">
      <!-- ✅ AI 亮點 -->
      <section id="sec-ai" class="anchor-offset grid lg:grid-cols-2 md:grid-cols-1 gap-8 md:gap-20 mt-6">
        <div class="mt-6">
            <img src="./assets/page/nani_ai_title.png" alt="" class="titleImg">
        </div>
      </section>

      <!-- AI cards -->
      <section>
        <div id="aiCards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3"></div>

     
      </section>

      <!-- AI detail -->
      <section id="aiDetail" class="anchor-offset ">
        <div class="fade-in" id="aiDetailInner">
          <div class="flex flex-wrap items-center justify-center gap-2 mb-10 mt-60" id="aiTabs"></div>

          <div class="bg-white/80 rounded-[40px] p-20 md:pt-24 cardBox flex flex-col lg:flex-row gap-10 items-center relative">
            <div class="flex-1 w-full space-y-6" id="aiDesc"></div>

            <div class="flex-1 w-full">
              <div class="ai-media aspect-video bg-black relative cursor-pointer group">
                <img id="aiVideoThumb" src="" alt="AI video preview" class="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-opacity">
                <div class="absolute inset-0 flex items-center justify-center">
                  <div id="aiPlayBtn"
                    class="w-24 h-24 rounded-full flex items-center justify-center shadow-2xl transform group-hover:scale-110 transition-transform"
                    style="background:#E6744A;">
                    <svg width="45" height="45" viewBox="0 0 24 24" fill="white">
                      <path d="M8,5.14V19.14L19,12.14L8,5.14Z" />
                    </svg>
                  </div>
                </div>
              </div>
              <div class="text-center mt-4 text-sm text-gray-500 font-bold">（點擊可接播放行為 / 之後替換成真影片）</div>
            </div>

            <!-- 背景裝飾 -->
            <div class="absolute -left-20 -top-0 w-40">
              <img src="./assets/page/nani_homepage_leaf_1.png" alt="">
            </div>
            <!-- 背景裝飾 -->
            <div class="absolute -right-20 -top-20 w-40">
              <img src="./assets/page/nani_homepage_leaf_2.png" alt="">
            </div>
          </div>
        </div>
      </section>
      <!-- /AI 亮點 -->
    </main>

    <footer class="mt-16 text-center">
      <div class="inline-block bg-white/50 backdrop-blur-sm px-10 py-4 rounded-full border border-white/50 text-gray-600 font-medium">
        南一書局企業股份有限公司版權所有 ©
      </div>
    </footer>
  </div>

  <!-- Back to top -->
  <button id="backToTop"
    class="fixed bottom-20 right-4 md:right-10 opacity-0 pointer-events-none leaf-animate cursor-pointer z-50"
    type="button" aria-label="回到頂部">
    <svg width="60" height="80" viewBox="0 0 60 80" fill="none">
      <path d="M30 80C30 80 5 60 5 35C5 10 30 0 30 0C30 0 55 10 55 35C55 60 30 80 30 80Z" fill="#88C5A1" />
      <path d="M30 0V80" stroke="#fff" strokeWidth="2" />
      <path d="M30 20L45 10M30 40L50 30M30 60L40 55M30 20L15 10M30 40L10 30M30 60L20 55" stroke="#fff"
        strokeWidth="2" strokeLinecap="round" />
    </svg>
    回到頂部
  </button>

  <script>
    /* =========================
       Page fade in/out
       ========================= */
    window.addEventListener('load', () => {
      document.body.classList.add('is-visible');
      document.getElementById('bgHome')?.classList.add('is-show');
    });

    document.addEventListener('click', (e) => {
      const link = e.target.closest('a[href]');
      if (!link) return;
      const href = link.getAttribute('href') || '';
      if (href.startsWith('#') || href.startsWith('javascript:') || link.target === '_blank') return;
      e.preventDefault();
      document.body.classList.add('is-leaving');
      setTimeout(() => { window.location.href = href; }, 300);
    });

    /* =========================
       Drawer
       ========================= */
    const menuBtn = document.getElementById('menuBtn');
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('drawerOverlay');
    const closeBtn = document.getElementById('closeDrawerBtn');

    function openDrawer(){
      drawer?.classList.remove('translate-x-full');
      overlay?.classList.remove('pointer-events-none');
      overlay?.classList.add('opacity-100');
      document.body.style.overflow = 'hidden';
    }
    function closeDrawer(){
      drawer?.classList.add('translate-x-full');
      overlay?.classList.remove('opacity-100');
      overlay?.classList.add('pointer-events-none');
      document.body.style.overflow = '';
    }

    menuBtn?.addEventListener('click', openDrawer);
    closeBtn?.addEventListener('click', closeDrawer);
    overlay?.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

    /* =========================
       Back to top
       ========================= */
    const backToTopBtn = document.getElementById('backToTop');
    backToTopBtn?.addEventListener('click', () => window.scrollTo({ top:0, behavior:'smooth' }));
    function toggleBackToTop(){
      if (!backToTopBtn) return;
      const show = window.scrollY > 300;
      backToTopBtn.style.opacity = show ? '0.9' : '0';
      backToTopBtn.style.pointerEvents = show ? 'auto' : 'none';
    }
    window.addEventListener('scroll', toggleBackToTop, { passive:true });
    toggleBackToTop();

    /* =========================
       Header reveal (hover/scroll)
       ========================= */
    const siteHeader = document.getElementById('siteHeader');
    const topZone = document.getElementById('topRevealZone');
    let hideTimer = null;
    let isHoverTop = false;

    function showHeader(){ siteHeader?.classList.add('is-show'); }
    function hideHeader(){
      if (!siteHeader) return;
      if (window.scrollY <= 10) return;
      if (isHoverTop) return;
      siteHeader.classList.remove('is-show');
    }
    function scheduleHide(delay = 700){
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => hideHeader(), delay);
    }
    function syncTopState(){
      if (window.scrollY <= 10){
        clearTimeout(hideTimer);
        showHeader();
      }
    }

    window.addEventListener('scroll', () => {
      if (window.scrollY <= 10){ syncTopState(); return; }
      showHeader();
      scheduleHide(700);
    }, { passive:true });

    topZone?.addEventListener('mouseenter', () => { isHoverTop = true; showHeader(); clearTimeout(hideTimer); });
    topZone?.addEventListener('mouseleave', () => { isHoverTop = false; if (window.scrollY <= 10) return; scheduleHide(350); });
    siteHeader?.addEventListener('mouseenter', () => { isHoverTop = true; showHeader(); clearTimeout(hideTimer); });
    siteHeader?.addEventListener('mouseleave', () => { isHoverTop = false; if (window.scrollY <= 10) return; scheduleHide(350); });

    syncTopState();

    /* =========================
       ✅ AI 亮點：渲染資料 + 互動
       ========================= */
    const FEATURES = [
      {
        id:'unlimited-questions',
        title:'AI無限出題',
        description:[
          '① 現場老師最喜歡的架構編排，將數、量、形和計算單元穿插編排，教學更多元豐富。',
          '② 考量國小一學生的識字量，也重視單元難易度排序，因此先教「分與合」，再教「順序和多少」。',
          '③ 先教授數字書寫筆順的基礎，再教「認識0」更順暢。'
        ],
        imageUrl:'./assets/page/ai-card-01.png',
        videoThumbnail:'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&q=80&w=1200',
        color:'#B7DDC5'
      },
      {
        id:'essay-grading',
        title:'AI作文批改',
        description:[
          '① 自動化分析文章結構，提供分段建議與修辭優化指引。',
          '② 依據年級難度自動生成適性化評語，減輕老師批改負擔。',
          '③ 支援多種文體識別，包含敘事文、說明文及議論文。'
        ],
        imageUrl:'./assets/page/ai-card-02.png',
        videoThumbnail:'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&q=80&w=1200',
        color:'#B7DDC5'
      },
      {
        id:'communication',
        title:'親師溝通',
        description:[
          '① AI 輔助生成溫馨通知，一鍵傳達孩子在校表現。',
          '② 關鍵字分析與情緒偵測，讓親師溝通更理性也更具同理心。',
          '③ 自動翻譯功能，支援多國語言，消除語言隔閡。'
        ],
        imageUrl:'./assets/page/ai-card-03.png',
        videoThumbnail:'https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?auto=format&fit=crop&q=80&w=1200',
        color:'#B7DDC5'
      },
      {
        id:'assistant',
        title:'行政小幫手',
        description:[
          '① 自動彙整會議紀錄與代辦事項，工作效率大幅提升。',
          '② 文件智慧分類與檢索，告別混亂的檔案夾。',
          '③ 排課助理 AI，優化資源分配，解決衝突困擾。'
        ],
        imageUrl:'./assets/page/ai-card-04.png',
        videoThumbnail:'https://images.unsplash.com/photo-1507207611509-af012a3edead?auto=format&fit=crop&q=80&w=1200',
        color:'#B7DDC5'
      }
    ];

    let activeId = FEATURES[0].id;

    const aiCards = document.getElementById('aiCards');
    const aiTabs = document.getElementById('aiTabs');
    const aiDesc = document.getElementById('aiDesc');
    const aiThumb = document.getElementById('aiVideoThumb');
    const aiPlayBtn = document.getElementById('aiPlayBtn');
    const aiDetailInner = document.getElementById('aiDetailInner');
    const aiDetail = document.getElementById('aiDetail');

    function renderAi(){
      if (!aiCards || !aiTabs || !aiDesc || !aiThumb || !aiPlayBtn || !aiDetailInner) return;

      const current = FEATURES.find(f => f.id === activeId) || FEATURES[0];

      aiCards.innerHTML = FEATURES.map(f => `
        <div class="ai-card ${activeId === f.id ? 'is-active' : ''}" data-ai-card="${f.id}">
          <div class="rounded-[20px] overflow-hidden aspect-[4/3] bg-white shadow-inner">
            <img src="${f.imageUrl}" alt="${f.title}"
              class="w-full h-full object-cover hover:scale-110 transition-transform duration-700">
          </div>
          <div class="flex items-center justify-center mt-1 mb-2">
            <div class="nav-pill nav-pill--special">
              ${f.title}
            </div>
          </div>
        </div>
      `).join('');

      aiTabs.innerHTML = `
        <div class="bg-white/60 backdrop-blur-md rounded-full p-2 shadow-inner border border-white flex flex-wrap justify-center gap-2">
          ${FEATURES.map(f => `
            <button type="button"
              class="nav-pill ${activeId === f.id ? 'nav-pill--active' : 'nav-pill--special'}"
              data-ai-tab="${f.id}">
              ${f.title}
            </button>
          `).join('')}
        </div>
      `;

      aiDetailInner.classList.remove('fade-in');
      void aiDetailInner.offsetWidth;
      aiDetailInner.classList.add('fade-in');

      aiDesc.innerHTML = current.description.map(line => `
        <div class="flex gap-4 items-start">
          <div class="ai-dot" style="background:${current.color};"></div>
          <p class="text-gray-700 text-xl md:text-2xl leading-relaxed font-bold tracking-wide">${line}</p>
        </div>
      `).join('');

      aiThumb.src = current.videoThumbnail;
      aiPlayBtn.style.background = current.color;
    }

    document.addEventListener('click', (e) => {
      const card = e.target.closest('[data-ai-card]');
      if (card){
        activeId = card.getAttribute('data-ai-card');
        renderAi();
        aiDetail?.scrollIntoView({ behavior:'smooth', block:'start' });
        return;
      }
      const tab = e.target.closest('[data-ai-tab]');
      if (tab){
        const id = tab.getAttribute('data-ai-tab');
        if (activeId === id) return;
        activeId = id;
        renderAi();
      }
    });

    // init
    renderAi();
    (function initAiBgAlignToFold(){
  const PAGE = document.querySelector('.page_1');
  if(!PAGE) return;

  const imgUrl = './assets/page/nani_ai_bg_1.png'; // 第一張背景圖
  const img = new Image();
  img.src = imgUrl;

  function update(){
    // fold 線：頁面一開始的 100vh（也就是 viewport 高度）
    const foldY = window.innerHeight; // px

    // 你要的 size：100vw auto => 實際渲染寬度 = viewport 寬
    const renderW = window.innerWidth;

    // 等圖片 natural size 有了才算
    const nw = img.naturalWidth || 1;
    const nh = img.naturalHeight || 1;

    // 等比縮放：100vw auto
    const scale = renderW / nw;
    const renderH = nh * scale; // ✅ 第一張背景實際高度（px）

    // 讓「圖片底部」對齊 foldY
    // top + renderH = foldY  => top = foldY - renderH
    const top = foldY - renderH;

    PAGE.style.setProperty('--ai-bg1-h', `${renderH}px`);
    PAGE.style.setProperty('--ai-bg1-top', `${top}px`);
  }

  // 圖片載入完成後計算一次
  if (img.complete) update();
  else img.onload = update;

  // resize 時重算（很重要，因為 100vw/100vh 都會變）
  window.addEventListener('resize', update, { passive: true });
})();
  </script>
